name: smep

# smep's formula (the `smep` command) and cask (smep.app plus the command),
# kept the way formula.yml keeps keepane's, on macOS only (there is no
# Linux build, see the note in the formula):
#  - check: a change to either installs and tests both on a real Mac
#  - bump: on a schedule (or by hand) follow smep's latest release, test
#    the new version the same way, and commit it only if that passes.
#
# The bump runs here, with this repo's own token, so the smep repo needs
# no secret with write access to the tap.
on:
  push:
    branches: [main]
    paths:
      - Formula/smep.rb
      - Casks/smep.rb
      - scripts/bump-smep.sh
      - .github/workflows/smep.yml
  pull_request:
    paths:
      - Formula/smep.rb
      - Casks/smep.rb
      - scripts/bump-smep.sh
      - .github/workflows/smep.yml
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smep:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # brew audit --online asks the GitHub API about the repo; anonymous
      # calls from a shared runner IP run into the rate limit
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Follow the latest smep release
        id: bump
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/bump-smep.sh

      - name: Skip when nothing changed
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ steps.bump.outputs.changed }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tap this checkout
        if: steps.go.outputs.run == 'true'
        run: |
          # brew taps a git repo; commit the bumped files locally first so
          # the tap sees them as they will be pushed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "smep ${{ steps.bump.outputs.version }}"
          brew tap newdee/tap "$GITHUB_WORKSPACE"
          # the formula and the cask name the same release
          formula=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/smep.rb | sort -u)
          cask=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/smep.rb)
          test "$formula" = "$cask"
          echo "version=$cask" >> "$GITHUB_OUTPUT"

      - name: Audit
        if: steps.go.outputs.run == 'true'
        run: |
          brew audit --formula --strict --online newdee/tap/smep
          brew audit --cask --strict --online newdee/tap/smep

      - name: Install, test, uninstall the formula
        if: steps.go.outputs.run == 'true'
        run: |
          brew install --formula newdee/tap/smep
          # a Developer ID signature must validate on its own (a binary
          # signed inside a bundle does not, and AMFI kills it)
          codesign --verify --verbose=2 "$(brew --prefix smep)/bin/smep"
          brew test newdee/tap/smep
          want=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/smep.rb | sort -u)
          got=$("$(brew --prefix)/bin/smep" --version)
          test "$got" = "smep $want"
          # the universal binary carries both architectures
          lipo -archs "$(brew --prefix)/bin/smep" | grep -q arm64
          lipo -archs "$(brew --prefix)/bin/smep" | grep -q x86_64
          brew uninstall --formula newdee/tap/smep
          test ! -e "$(brew --prefix)/bin/smep"

      - name: Install, test, uninstall the cask
        if: steps.go.outputs.run == 'true'
        run: |
          brew install --cask newdee/tap/smep
          app=/Applications/smep.app
          test -d "$app"
          want=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/smep.rb)
          got=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)
          test "$want" = "$got"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Gatekeeper accepts the app once it is notarized; until then the
          # quarantine the cask set would stop the command below, as it
          # stops the first start from Finder (the cask's caveats say so)
          if ! spctl --assess --type execute --verbose=2 "$app"; then
            echo "::warning::smep.app is not notarized; Gatekeeper needs Open Anyway on the first start"
            xattr -dr com.apple.quarantine "$app"
          fi
          # the command is the app's own binary
          test -L "$(brew --prefix)/bin/smep"
          got=$("$(brew --prefix)/bin/smep" --version)
          test "$got" = "smep $want"
          lipo -archs "$app/Contents/MacOS/smep" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/smep" | grep -q x86_64
          brew uninstall --cask --zap newdee/tap/smep
          test ! -d "$app"
          test ! -e "$(brew --prefix)/bin/smep"

      - name: Publish the bump
        if: steps.go.outputs.run == 'true' && steps.bump.outputs.changed == 'true'
        run: git push origin HEAD:main
