name: smep

# smep's formula, kept the way formula.yml keeps keepane's, on macOS only
# (the formula has no Linux build, see the note in it):
#  - check: a change to the formula installs and tests it on a real Mac
#  - bump: on a schedule (or by hand) follow smep's latest release, test
#    the new version the same way, and commit it only if that passes.
#
# The bump runs here, with this repo's own token, so the smep repo needs
# no secret with write access to the tap.
on:
  push:
    branches: [main]
    paths:
      - Formula/smep.rb
      - scripts/bump-smep.sh
      - .github/workflows/smep.yml
  pull_request:
    paths:
      - Formula/smep.rb
      - scripts/bump-smep.sh
      - .github/workflows/smep.yml
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formula:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # brew audit --online asks the GitHub API about the repo; anonymous
      # calls from a shared runner IP run into the rate limit
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Follow the latest smep release
        id: bump
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/bump-smep.sh

      - name: Skip when nothing changed
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ steps.bump.outputs.changed }}" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tap this checkout
        if: steps.go.outputs.run == 'true'
        run: |
          # brew taps a git repo; commit the bumped formula locally first so
          # the tap sees the file as it will be pushed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "smep ${{ steps.bump.outputs.version }}"
          brew tap newdee/tap "$GITHUB_WORKSPACE"

      - name: Audit
        if: steps.go.outputs.run == 'true'
        run: brew audit --formula --strict --online newdee/tap/smep

      - name: Install, test, uninstall
        if: steps.go.outputs.run == 'true'
        run: |
          brew install --formula newdee/tap/smep
          brew test newdee/tap/smep
          want=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/smep.rb | sort -u)
          got=$("$(brew --prefix)/bin/smep" --version)
          test "$got" = "smep $want"
          # the universal binary carries both architectures
          lipo -archs "$(brew --prefix)/bin/smep" | grep -q arm64
          lipo -archs "$(brew --prefix)/bin/smep" | grep -q x86_64
          brew uninstall --formula newdee/tap/smep
          test ! -e "$(brew --prefix)/bin/smep"

      - name: Publish the bump
        if: steps.go.outputs.run == 'true' && steps.bump.outputs.changed == 'true'
        run: git push origin HEAD:main
